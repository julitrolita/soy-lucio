<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Flex Grow</title>
<style>
.container {
    border: 2px solid #000;
    padding: 10px;
    display: flex;
    height: 200px;
}
.item {
    background: #4caf50;
    color: #fff;
    padding: 10px;
    margin: 5px;
}
</style>
</head>
<body>
<h2>Flex Grow</h2>
<div class="container"><div class="item" style="flex-grow:1;">1</div><div class="item" style="flex-grow:2;">2</div><div class="item" style="flex-grow:1;">3</div></div>
</body>
</html>
