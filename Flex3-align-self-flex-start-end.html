<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Align Self Start/End</title>
<style>
.container {
    border: 2px solid #000;
    padding: 10px;
    display: flex;
    height: 200px;
}
.item {
    background: #4caf50;
    color: #fff;
    padding: 10px;
    margin: 5px;
}
</style>
</head>
<body>
<h2>Align Self Start/End</h2>
<div class="container" style="align-items:center;height:200px;"><div class="item" style="align-self:flex-start;">A</div><div class="item">B</div><div class="item" style="align-self:flex-end;">C</div></div>
</body>
</html>
