<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Align Self Center</title>
<style>
.container {
    border: 2px solid #000;
    padding: 10px;
    display: flex;
    height: 200px;
}
.item {
    background: #4caf50;
    color: #fff;
    padding: 10px;
    margin: 5px;
}
</style>
</head>
<body>
<h2>Align Self Center</h2>
<div class="container" style="align-items:flex-start;height:200px;"><div class="item">1</div><div class="item" style="align-self:center;">2</div><div class="item">3</div></div>
</body>
</html>
