<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Align Items Baseline</title>
<style>
.container {
    border: 2px solid #000;
    padding: 10px;
    display: flex;
    height: 200px;
}
.item {
    background: #4caf50;
    color: #fff;
    padding: 10px;
    margin: 5px;
}
</style>
</head>
<body>
<h2>Align Items Baseline</h2>
<div class="container" style="align-items:baseline;"><div class="item" style="font-size:12px;">1</div><div class="item" style="font-size:30px;">2</div><div class="item" style="font-size:18px;">3</div></div>
</body>
</html>
