<!DOCTYPE html>
<html>
<head>
<style>
.container {
  display: flex;
  height: 200px;
  align-items: baseline;
  background-color: DodgerBlue;
}

.container div {
  background-color: #f1f1f1;
  width: 100px;
  margin: 10px;
  padding: 10px;
  text-align: center;  
  font-size: 30px;
}
</style>
</head>
<body>

<h1>align-items: baseline</h1>

<p>align-items: baseline; aligns the flex items at the baseline of the conatiner:</p>

<div class="container">
  <div><h2>1</h2></div>
  <div><h3>2</h3></div>
  <div><h4>3</h4></div>  
  <div><small>4</small></div>  
</div>

</body>
</html>
