<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Flex Flow Row Wrap</title>
<style>
.container {
    border: 2px solid #000;
    padding: 10px;
    display: flex;
    height: 200px;
}
.item {
    background: #4caf50;
    color: #fff;
    padding: 10px;
    margin: 5px;
}
</style>
</head>
<body>
<h2>Flex Flow Row Wrap</h2>
<div class="container" style="flex-flow:row wrap;"><div class="item">1</div><div class="item">2</div><div class="item">3</div><div class="item">4</div><div class="item">5</div></div>
</body>
</html>
